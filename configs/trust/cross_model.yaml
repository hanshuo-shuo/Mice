# Experiment 2: Cross-model familiarity (no trust prompting).
# Same-family pairs vs cross-family pairs.
# Usage: python run_trust_experiment.py --config configs/trust/cross_model.yaml

experiment: cross_model
episodes: 10
max_steps: 50
world_name: "21_05"

conditions:
  # Same-family: Gemini with Gemini
  - name: gemini_gemini
    trust_condition: neutral
    model1: "google/gemini-3-flash-preview"
    model2: "google/gemini-3-flash-preview"

  # Same-family: Qwen with Qwen
  - name: qwen_qwen
    trust_condition: neutral
    model1: "qwen/qwen3.5-35b-a3b"
    model2: "qwen/qwen3.5-35b-a3b"

  # Cross-family: Gemini with Qwen
  - name: gemini_qwen
    trust_condition: neutral
    model1: "google/gemini-3-flash-preview"
    model2: "qwen/qwen3.5-35b-a3b"

  # Frontier single: Claude as control
  - name: claude_claude
    trust_condition: neutral
    model1: "anthropic/claude-sonnet-4.6"
    model2: "anthropic/claude-sonnet-4.6"
