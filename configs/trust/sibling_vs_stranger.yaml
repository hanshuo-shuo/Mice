# Experiment 1: Same model, sibling vs stranger prompts.
# Usage: python run_trust_experiment.py --config configs/trust/sibling_vs_stranger.yaml

experiment: prompted_trust
episodes: 10
max_steps: 50
world_name: "21_05"

conditions:
  - name: sibling
    trust_condition: sibling
    model1: "google/gemini-3-flash-preview"
    model2: "google/gemini-3-flash-preview"

  - name: stranger
    trust_condition: stranger
    model1: "google/gemini-3-flash-preview"
    model2: "google/gemini-3-flash-preview"
